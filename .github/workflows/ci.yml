name: FragDenStaat CI

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - uses: j178/prek-action@v1
        env:
          SKIP: makemessages-de

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - name: Start services
        run: docker compose -f compose-dev.yaml up --wait
      - name: Install system-level dependencies
        run: sudo apt-get update && sudo apt-get install libxml2-dev libxslt1-dev python3-dev libgdal-dev gdal-bin libmagic-dev libmagickwand-dev gettext libpoppler-cpp-dev
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - uses: pnpm/setup@v3
        with:
          cache: true
      - name: Install dependencies
        run: |
          uv sync --locked
          playwright install --with-deps chromium
      - name: Check German translations are up to date
        if: matrix.python-version == '3.13'
        run: |
          make checkmessagesde
          git diff --exit-code -- '**/django.po'
      - name: Build frontend
        run: pnpm run build
      - name: Compile translations
        run: python manage.py compilemessages -i node_modules -l de
      - name: Restore database cache
        uses: actions/cache/restore@v5
        id: db_cache
        with:
          path: cache-dump.sql
          key: db-${{ runner.os }}-${{ hashFiles('fragdenstaat_de/**/migrations/*.py') }}
      - name: Restore database
        if: steps.db_cache.outputs.cache-hit == 'true'
        run: ./scripts/restore_cached_db.sh
      - name: Run tests
        run: |
          pytest -n auto --cov --cov-report= fragdenstaat_de/
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
